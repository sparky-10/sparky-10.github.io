<!doctype html>
<html lang="en">
<head>

  <!--Basic recommended meta tags-->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!--Give page a name-->
  <title>My worker</title>
  
  <!--Version of Pyscript to fetch
  /* Note: Best to use a fixed version to ensure your page doesn't break (see repository for up-to-date versions)-->
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
  
  <!-- For splashscreen (e.g. see https://examples.pyscriptapps.com/matplotlib/latest/) -->
  <style>
    #loading { outline: none; border: none; background: transparent }
  </style>
  <script type="module">
    const loading = document.getElementById('loading');
    addEventListener('py:ready', () => loading.close());
    loading.showModal();
  </script>
        
</head>

<!--
Main body of your page
----------------------
NOTE:
- Page deliberately simple and not designed to look pretty
- Any formatting and use of style purely for quick page construction purposes (and probably quite hacky)
- Tested on Firefox and (partially) Chrome on a standard desktop/laptop screen
- May not work well cross- platform/browser/device
- Proper use of CSS and up-to-date cross-browser/device methods is advised if you want a page to perform properly
-->

<body>

  <!--Splashscreen  (e.g. see https://examples.pyscriptapps.com/matplotlib/latest/)-->
  <dialog id="loading">
    <h1>Loading...</h1>
  </dialog>
  
  <!--Title and summary of page-->
  <h1>My worker</h1>
  <p>This page is an example of using PyScript to run a worker separately to the main thread.</p>

  <div>
  <h2>Some numbers</h2>
  <label for="num1Id">a:</label>
  <input id="num1Id" type="number" name="num-1" value = 1 
    title="Variable used for very simple calculations" autocomplete="off"></input>
  <label for="num2Id">b:</label>
  <input id="num2Id" type="number" name="num-2"  value = 2
    title="Variable used for very simple calculations" autocomplete="off"></input>
  </div>
  
  <div>
  <h2>Main thread</h2>
  <button id="runMainQuickButtonId" name="run-main-quick-button" disabled autocomplete="off" 
    title="Run simple/fast code in main thread">Run quick calculation</button>
  <button id="runMainSlowButtonId" name="run-main-slow-button" disabled autocomplete="off" 
    title="Run slow time consuming code in main thread">Run long calculation</button>
  <h3>Update:</h3>
  <p id="mainParagraphId">a + b = ??</p>
  <h2>Worker thread</h2>
  <button id="runWorkerQuickButtonId" name="run-worker-quick-button" disabled autocomplete="off" 
    title="Run longer/blocking code in worker thread">Run quick calculation</button>
  <button id="runWorkerSlowButtonId" name="run-worker-slow-button" disabled autocomplete="off" 
    title="Run slow time consuming code in worker thread">Run long calculation</button>
  <h3>Update:</h3>
  <p id="workerParagraphId">a + b = ??</p>
  </div>
  
  <!--Python/PyScript code - main thread-->
  <script type="py" src="./main.py" config="./myConfig.toml">
  </script>
  
  <!--Python/PyScript code - worker thread-->
  <script type="py" src="./myWorker.py" config="./myWorkerConfig.toml" worker name="myWorker">
  </script>

</body>

</html>
